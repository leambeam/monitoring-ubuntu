route:
  group_by: ["alertname", "node"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "telegram"

templates:
  - /etc/alertmanager/templates/*.tmpl

receivers:
  - name: "telegram"
    telegram_configs:
      - bot_token_file: /etc/bot/bot-token.txt
        chat_id_file: /etc/bot/chat-id.txt
        message: '{{ template "telegram.message" . }}'
